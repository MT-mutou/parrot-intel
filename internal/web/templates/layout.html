{{define "layout"}}<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}}</title>
<link rel="stylesheet" href="/static/app.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦜</text></svg>">
</head>
<body>
<header class="topbar">
  <a class="brand" href="/"><span class="brand-icon">🦜</span><span class="brand-name">鹦鹉情报站<em>PARROT INTEL</em></span></a>
  <nav>
    <a href="/" class="{{if eq .Active "index"}}on{{end}}">情报流</a>
    <a href="/briefing" class="{{if eq .Active "briefing"}}on{{end}}">每日简报</a>
    <a href="/dashboard" class="{{if eq .Active "dashboard"}}on{{end}}">态势总览</a>
    <a href="/sources" class="{{if eq .Active "sources"}}on{{end}}">来源</a>
    <a href="/settings" class="{{if eq .Active "settings"}}on{{end}}">设置</a>
  </nav>
  <div class="top-actions">
    <span id="col-badge" class="col-badge {{if .ColRunning}}running{{end}}" title="{{.ColStatus}}">{{if .ColRunning}}⟳ 收集中{{else}}● 在线{{end}}</span>
    <button id="btn-collect" class="btn btn-primary" onclick="doCollect(this)">立即收集</button>
  </div>
</header>
<main class="container">
{{template "content" .}}
</main>
<footer class="footer">鹦鹉安全实验室 · ParrotIntel · <span class="mono">single-binary Go</span></footer>
<div id="toast" class="toast"></div>
<script src="/static/app.js"></script>
</body>
</html>{{end}}
