# 鹦鹉情报站 ParrotIntel —— Nginx 站点配置
# 安装位置：/etc/nginx/conf.d/parrot-intel.conf
#
# 职责：静态托管前端产物（/var/www/parrot-intel）+ 反向代理 /api 到后端服务（127.0.0.1:8080）
# 前后端同域，无 CORS 问题，前端无需配置 VITE_API_BASE。

server {
    listen 80;
    server_name _;                      # 有域名改为域名，如 intel.example.com

    # ---- 前端静态资源 ----
    root /var/www/parrot-intel;
    index index.html;

    # ---- gzip 压缩 ----
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json
               application/xml image/svg+xml font/woff2;
    gzip_vary on;

    # ---- API 反向代理到 Go 后端 ----
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;        # 手动收集 / AI 简报等长请求不被掐断
    }

    # ---- 带内容 hash 的构建产物：一年长缓存 ----
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- SPA 前端路由回退 ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    client_max_body_size 10m;
}
